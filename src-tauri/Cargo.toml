[package]
name = "flunkey"
version = "1.0.0"
description = "Flunkey — voice-activated AI assistant for Windows"
authors = ["Flunkey <flunkeymanager@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flunkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
msix-autostart = ["dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-autostart = "2.5.1"
winapi = { version = "0.3.9", features = ["winuser", "libloaderapi", "processthreadsapi", "handleapi", "winbase", "winnt", "sysinfoapi", "wincred", "errhandlingapi"] }
xcap = "0.9.8"
image = { version = "0.25.10", features = ["jpeg"] }
base64 = "0.23.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha1 = "0.11.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["ApplicationModel"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

