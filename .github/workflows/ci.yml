name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Fetch whisper engine (tauri resources glob)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-whisper.ps1
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
